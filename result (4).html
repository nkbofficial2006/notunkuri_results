<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>নতুন কুড়ি বিদ্যাপীঠ — ফলাফল</title>

<body style="background:#f4f6f8; margin:0; padding:18px 8px;">
<!-- ============================================================
     নতুন কুড়ি বিদ্যাপীঠ — ফলাফল পেজ (Google Sheet ডেটাবেস + লাইভ PDF)
     Blogger Page → HTML view-এ পুরো কোডটি পেস্ট করুন
============================================================= -->
<style>
  .center-layout {
    max-width: 1100px;
    margin: 0 auto !important;
    padding: 0 15px;
  }
</style>

<!-- PDF ইঞ্জিন লাইব্রেরি -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

<div class="center-layout">
<style>
  /* ফলাফল পেজের প্রফেশনাল ডিজাইন */
  .result-wrapper {
    max-width: 600px;
    margin: 0 auto;
    background: #fff;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    font-family: 'Kalpurush', 'SolaimanLipi', sans-serif;
    border-top: 5px solid #275638;
    margin-bottom: 30px;
  }
  .result-header { text-align: center; margin-bottom: 20px; border-bottom: 2px dashed #eee; padding-bottom: 15px; }
  .result-header h2 { color: #275638; margin: 0; font-size: 22px; font-weight: bold; }
  .result-header p { color: #666; font-size: 14px; margin: 5px 0 0 0; }
  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #333; font-size: 16px; }
  .form-control { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; background-color: #fcfcfc; box-sizing: border-box; }
  .form-control:focus { border-color: #275638; outline: none; background-color: #fff; }

  .btn-submit-result { width: 100%; background: #275638; color: #fff; padding: 14px; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s ease; margin-top: 10px; }
  .btn-submit-result:hover { background: #1e422b; }
  .btn-submit-result:disabled { background: #7a9a86; cursor: wait; }

  #result-display-area { display: none; margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; text-align: center; }
  .pdf-frame { width: 100%; height: 640px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 15px; background:#f7f7f7; }
  .preview-hint { font-size: 12.5px; color: #888; margin: -8px 0 12px; }
  .btn-download-pdf { display: inline-block; background: #d9534f; color: #fff !important; padding: 10px 20px; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 16px; box-shadow: 0 2px 4px rgba(217,83,79,0.3); }
  .btn-download-pdf:hover { background: #c9302c; }

  .error-msg { color: #d9534f; font-size: 14px; margin-top: 5px; display: none; text-align: center; font-weight: bold; }
</style>

<div class="result-wrapper">
  <div class="result-header">
    <h2>একাডেমিক ফলাফল</h2>
    <p>নতুন কুড়ি বিদ্যাপীঠ-এর শিক্ষার্থীদের ব্যক্তিগত মার্কশীট</p>
  </div>

  <div class="form-group">
    <label>পরীক্ষার নাম নির্বাচন করুন:</label>
    <select id="examName" class="form-control">
      <option value="">-- নির্বাচন করুন --</option>
      <option value="1st_term">১ম সাময়িক পরীক্ষা</option>
      <option value="2nd_term">২য় সাময়িক পরীক্ষা</option>
      <option value="annual">বার্ষিক পরীক্ষা</option>
    </select>
  </div>

  <div class="form-group">
    <label>শ্রেণি নির্বাচন করুন:</label>
    <select id="className" class="form-control">
      <option value="">-- নির্বাচন করুন --</option>
      <option value="class_play">প্লে শ্রেণি</option>
      <option value="class_nursery">নার্সারী শ্রেণি</option>
      <option value="class_1">১ম শ্রেণি</option>
      <option value="class_2">২য় শ্রেণি</option>
      <option value="class_3">৩য় শ্রেণি</option>
      <option value="class_4">৪র্থ শ্রেণি</option>
      <option value="class_5">৫ম শ্রেণি</option>
      <option value="class_6">৬ষ্ঠ শ্রেণি</option>
      <option value="class_7">৭ম শ্রেণি</option>
      <option value="class_8">৮ম শ্রেণি</option>
      <option value="class_9">৯ম শ্রেণি</option>
      <option value="class_10">১০ম শ্রেণি</option>
    </select>
  </div>

  <div class="form-group">
    <label>রোল নম্বর লিখুন:</label>
    <input type="number" id="rollNumber" class="form-control" placeholder="ইংরেজিতে রোল নম্বর লিখুন (যেমন: 5)">
  </div>

  <button id="submitBtn" class="btn-submit-result" onclick="fetchResult()">রেজাল্ট দেখুন</button>
  <div id="error-text" class="error-msg">অনুগ্রহ করে সব তথ্য সঠিকভাবে পূরণ করুন।</div>

  <!-- রেজাল্ট প্রদর্শন এরিয়া -->
  <div id="result-display-area">
    <h3 style="color: #333; font-size: 18px; margin-bottom: 15px;" id="student-title">রেজাল্ট মার্কশীট</h3>

    <!-- ব্রাউজারেই তৈরি মার্কশিট PDF প্রিভিউ -->
    <iframe id="pdf-viewer" class="pdf-frame" src=""></iframe>
    <p class="preview-hint">মোবাইলে প্রিভিউ না দেখলে নিচের ডাউনলোড বাটন ব্যবহার করুন</p>
    <br>
    <a id="pdf-download" href="#" class="btn-download-pdf">📄 মার্কশীট ডাউনলোড করুন</a>
  </div>
</div>

<script>
/* ===== Google Sheet ডেটাবেস সংযোগ ===== */

/* নিজের সাইটের (same-origin) data.json — নেটওয়ারক যাই করুক, এটা সবসময় চলবে */
var nkDataP = (function () {
  var names = ["data.json", "data (1).json", "data (2).json", "data (3).json"];
  function tryOne(i) {
    if (i >= names.length) return Promise.resolve(null);
    return fetch(names[i], { cache: "no-cache" }).then(function (r) {
      return r.ok ? r.json() : tryOne(i + 1);
    }).catch(function () { return tryOne(i + 1); });
  }
  return tryOne(0);
})();


function parseGviz(text) {
  var m = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);?\s*$/);
  return JSON.parse(m[1]);
}
var nkStatusFn = null;
function nkStatus(t) { if (nkStatusFn) nkStatusFn(t); }

function jsonpFetch(sheet, tq, ms) {
  return new Promise(function (resolve, reject) {
    var cb = "__gviz_" + sheet + "_" + Math.floor(Math.random() * 1e6);
    var s = document.createElement("script");
    var to = setTimeout(function () { s.remove(); reject(new Error("jsonp-timeout")); }, ms);
    window[cb] = function (resp) { clearTimeout(to); delete window[cb]; s.remove(); resolve(resp); };
    s.onerror = function () { clearTimeout(to); delete window[cb]; s.remove(); reject(new Error("jsonp-error")); };
    s.src = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?sheet=" + sheet +
            (tq ? "&tq=" + encodeURIComponent(tq) : "") + "&tqx=out:json;responseHandler:" + cb;
    document.head.appendChild(s);
  });
}
function directFetch(sheet, tq, ms) {
  return new Promise(function (resolve, reject) {
    if (typeof AbortController === "undefined") return reject(new Error("no-abort"));
    var ctrl = new AbortController();
    var to = setTimeout(function () { ctrl.abort(); reject(new Error("fetch-timeout")); }, ms);
    fetch("https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?sheet=" + sheet +
          (tq ? "&tq=" + encodeURIComponent(tq) : "") + "&tqx=out:json", { signal: ctrl.signal })
      .then(function (r) { return r.text(); })
      .then(function (txt) { clearTimeout(to); resolve(parseGviz(txt)); })
      .catch(function (e) { clearTimeout(to); reject(e); });
  });
}
function proxyFetch(sheet, tq, ms) {
  var url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?sheet=" + sheet +
            (tq ? "&tq=" + encodeURIComponent(tq) : "") + "&tqx=out:json";
  return new Promise(function (resolve, reject) {
    var ctrl = new AbortController();
    var to = setTimeout(function () { ctrl.abort(); reject(new Error("proxy-timeout")); }, ms);
    fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(url), { signal: ctrl.signal })
      .then(function (r) { return r.text(); })
      .then(function (txt) { clearTimeout(to); resolve(parseGviz(txt)); })
      .catch(function (e) { clearTimeout(to); reject(e); });
  });
}
/* ৪-স্তরের সংযোগ চেষ্টা — প্রতিটি ধাপে টাইমার, তাই আর কখনো আটকে থাকবে না */
function getSheet(sheet, tq) {
  nkStatus("ডেটা আনা হচ্ছে (১/৪)…");
  return directFetch(sheet, tq, 10000).catch(function (e1) {
    nkStatus("ডেটা আনা হচ্ছে (২/৪)…");
    return jsonpFetch(sheet, tq, 10000).catch(function (e2) {
      nkStatus("ডেটা আনা হচ্ছে (৩/৪)…");

        });
      });

}
function rows2arr(j) {
  return j.table.rows.map(function (r) {
    return j.table.cols.map(function (_, i) {
      var c = r.c && r.c[i]; return c && c.v != null ? c.v : null;
    });

}
function buildData(stRows, mkRows) {
  var D = {};
  stRows.forEach(function (r) {
    var key = r[1] + "|" + r[4];
    if (!D[key]) D[key] = { cls: r[1], shift: r[2], section: r[3], exam: r[4], year: r[0], students: [] };
    D[key].students.push({
      roll: r[5], name: r[6], sid: r[7] || "", father: r[8] || "", mother: r[9] || "",
      group: r[10] || "", total: r[14] || 0, gpa: r[15] || 0, grade: r[16] || "F", merit: r[17] || 0,
